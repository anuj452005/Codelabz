services:
  app:
    image: codelabz:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      # We still need to pass args because Vite injects env vars ONLY during the build stage.
      # However, Docker Compose can cleanly source these from our local .env file.
      args:
        - VITE_APP_FIREBASE_API_KEY=${VITE_APP_FIREBASE_API_KEY}
        - VITE_APP_AUTH_DOMAIN=${VITE_APP_AUTH_DOMAIN}
        - VITE_APP_DATABASE_URL=${VITE_APP_DATABASE_URL}
        - VITE_APP_FIREBASE_PROJECT_ID=${VITE_APP_FIREBASE_PROJECT_ID}
        - VITE_APP_FIREBASE_STORAGE_BUCKET=${VITE_APP_FIREBASE_STORAGE_BUCKET}
        - VITE_APP_FIREBASE_MESSAGING_SENDER_ID=${VITE_APP_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_APP_FIREBASE_APP_ID=${VITE_APP_FIREBASE_APP_ID}
        - VITE_APP_FIREBASE_MEASUREMENTID=${VITE_APP_FIREBASE_MEASUREMENTID}
        - VITE_APP_USE_EMULATOR=${VITE_APP_USE_EMULATOR}
        - VITE_APP_FIREBASE_FCM_VAPID_KEY=${VITE_APP_FIREBASE_FCM_VAPID_KEY}
    container_name: codelabz-production
    env_file:
      - .env
    ports:
      - "8000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - codelabz-network
    labels:
      - "com.codelabz.description=Codelabz Production Application"
      - "com.codelabz.version=1.0"

networks:
  codelabz-network:
    driver: bridge
